<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — NEXUS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: #FFFFFF; display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Simple Header -->
  <header style="padding: 1.5rem; border-bottom: 1px solid var(--border);">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="/index.html" class="brand">
        <div class="brand-symbol">N</div>
        <span>NEXUS</span>
      </a>
      <span style="font-size: 0.875rem; color: var(--ink-secondary);">
        Need an account? <a href="/register.html" style="font-weight: 600;">Join NEXUS</a>
      </span>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div style="max-width: 420px; width: 100%;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="eyebrow">WELCOME BACK</span>
        <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Sign in to NEXUS</h1>
        <p style="color: var(--ink-secondary); font-size: 0.95rem;">Enter your university developer credentials.</p>
      </div>

      <!-- Error box -->
      <div id="auth-error" style="display: none; background: #FFF1F2; border: 1px solid #FECDD3; color: #BE123C; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.875rem; margin-bottom: 1.25rem;"></div>

      <form id="form-login">
        <div class="form-group">
          <label class="form-label" for="email">University or Student Email</label>
          <input type="email" id="email" class="form-control" placeholder="aarav@nexus.dev" required autofocus />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;">
          Sign in
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--ink-muted); background: var(--bg); padding: 0.85rem; border-radius: var(--radius-md); border: 1px solid var(--border);">
        <strong>Demo Accounts (Pre-seeded):</strong><br>
        <code>aarav@nexus.dev</code> (Aarav Sharma) / <code>password123</code><br>
        <code>rohan@nexus.dev</code> (Rohan Deshmukh) / <code>password123</code>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
